            baseSha: process.env.BASE_SHA || null,
            p1BaseMainSha: 'a586b99bd9ccca09d48088e323f97f12039e0ced', p1Gate: 'owner-merged-common-base-verified',
            runId: process.env.CI_RUN_ID, runAttempt: process.env.CI_RUN_ATTEMPT,
