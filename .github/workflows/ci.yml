          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [ci-typecheck, ci-contracts, ci-unit, ci-integration, ci-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-*-${{ github.sha }}-${{ github.run_id }}-*
          path: evidence
      - name: Require successful checks and matching evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, readdirSync } from 'node:fs';
          import { resolve, sep } from 'node:path';
          const expected = ['ci-typecheck', 'ci-contracts', 'ci-unit', 'ci-integration', 'ci-build'];
          const results = JSON.parse(process.env.NEEDS_JSON);
          assert.deepEqual(Object.keys(results).sort(), [...expected].sort(), 'Every required job must exist');
          for (const name of expected) assert.equal(results[name].result, 'success', `${name} must succeed, not skip/fail/cancel`);
          const checkedSha = execFileSync('git', ['-C', process.env.GITHUB_WORKSPACE || '.', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const lockHash = createHash('sha256').update(readFileSync('package-lock.json')).digest('hex');
          const directories = readdirSync('evidence');
          for (const name of expected) {
            const prefix = `${name}-${checkedSha}-${process.env.CI_RUN_ID}-`;
            const candidates = directories.filter((entry) => entry.startsWith(prefix) && /^[1-9][0-9]*$/.test(entry.slice(prefix.length)))
              .sort((a, b) => Number(b.slice(prefix.length)) - Number(a.slice(prefix.length)));
            const artifact = candidates[0];
            assert(artifact, `Missing exact-SHA/run artifact for ${name}`);
            const root = resolve('evidence', artifact);
            const manifest = JSON.parse(readFileSync(resolve(root, 'reports/manifest.json'), 'utf8'));
            assert.equal(manifest.checkName, name); assert.equal(manifest.result, 'success');
            assert.equal(manifest.checkedSha, checkedSha); assert.equal(manifest.lockfileSha256, lockHash);
            assert.equal(manifest.prHeadSha, process.env.PR_HEAD_SHA || null);
            assert.equal(manifest.baseSha, process.env.BASE_SHA || null);
            assert.equal(manifest.runId, process.env.CI_RUN_ID);
            const attempt = Number(manifest.runAttempt);
            assert(Number.isSafeInteger(attempt) && attempt > 0 && attempt <= Number(process.env.CI_RUN_ATTEMPT), 'Evidence must belong to a completed attempt in this run');
            assert.equal(artifact, `${prefix}${attempt}`);
            assert.equal(manifest.schemaVersion, 1); assert.equal(manifest.contractVersion, 1);
            assert.equal(manifest.prNumber, process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null);
            assert.equal(manifest.p1BaseMainSha, 'a586b99bd9ccca09d48088e323f97f12039e0ced');
            assert.equal(manifest.p1Gate, 'owner-merged-common-base-verified');
            assert(Array.isArray(manifest.files) && manifest.files.length > 0, 'Evidence cannot be empty');
            const listed = manifest.files.map((file) => file.path);
            assert.equal(new Set(listed).size, listed.length, 'Artifact paths must be unique');
            const kind = name.slice(3);
            const testCheck = ['contracts', 'unit', 'integration'].includes(kind);
            const required = [`reports/${kind}.log`, ...(testCheck ? [`reports/${kind}.xml`, `reports/${kind}.json`] : []), ...(name === 'ci-build' ? ['dist/index.html'] : [])];
            for (const path of required) {
              assert(listed.includes(path), `Missing required evidence: ${path}`);
              assert(readFileSync(resolve(root, path)).length > 0, `Required evidence is empty: ${path}`);
            }
            const actual = [];
            function collect(directory, prefix = '') {
              for (const item of readdirSync(directory, { withFileTypes: true })) {
                const path = prefix ? `${prefix}/${item.name}` : item.name;
                assert(item.isFile() || item.isDirectory(), 'Evidence must contain only regular files/directories');
                if (item.isDirectory()) collect(resolve(directory, item.name), path);
                else if (path !== 'reports/manifest.json') actual.push(path);
              }
            }
            collect(root);
            assert.deepEqual([...listed].sort(), actual.sort(), 'Every artifact byte must be listed, with no omitted reports or extra unhashed files');
            for (const file of manifest.files) {
              assert.equal(typeof file.path, 'string');
              assert.match(file.sha256, /^[0-9a-f]{64}$/);
              const path = resolve(root, file.path);
              assert(path.startsWith(root + sep), 'Artifact path must stay inside the artifact');
              assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), file.sha256, `Hash mismatch: ${file.path}`);
            }
            if (testCheck) {
              const report = JSON.parse(readFileSync(resolve(root, `reports/${kind}.json`), 'utf8'));
              assert.equal(report.success, true, 'Structured test report must succeed');
              for (const field of ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests']) assert(Number.isSafeInteger(report[field]) && report[field] >= 0, `Invalid test count: ${field}`);
              assert(report.numPassedTests > 0, 'At least one test must actually execute and pass');
              assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0); assert.equal(report.numTodoTests, 0);
              assert.equal(report.numTotalTests, report.numPassedTests, 'No skip/todo exclusions are permitted in P0');
              assert(Array.isArray(report.testResults) && report.testResults.length > 0, 'Executed test-file results are required');
              const assertions = [];
              for (const suite of report.testResults) {
                assert.equal(suite.status, 'passed'); assert(Array.isArray(suite.assertionResults));
                assertions.push(...suite.assertionResults);
              }
              assert.equal(assertions.length, report.numPassedTests, 'Structured counts must match the actual assertions');
              for (const assertion of assertions) assert.equal(assertion.status, 'passed', 'Every reported test must have executed successfully');
            }
          }
          console.log(`All ${expected.length} required checks and exact-SHA evidence verified for ${checkedSha}`);
          NODE
  pages-package:
    name: pages-package
    needs: [ci-required]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'chameleonjp-lab/ningentomodachi' &&
          needs.ci-required.result == 'success' && vars.PAGES_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      package-attempt: ${{ steps.package.outputs.package-attempt }}
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
      site-manifest-sha256: ${{ steps.package.outputs.site-manifest-sha256 }}
      build-attempt: ${{ steps.package.outputs.build-attempt }}
    steps:
      - name: Require exact merged-PR provenance
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.payload?.forced !== false) throw new Error('Push force state must be explicitly false');
            const matches = (pr) => pr.merged_at && pr.merge_commit_sha === context.sha &&
              pr.base?.ref === 'main' && pr.base?.repo?.full_name === 'chameleonjp-lab/ningentomodachi';
            for (let attempt = 0; attempt < 6; attempt++) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo, commit_sha: context.sha, per_page: 100,
              });
              for (const candidate of data.filter(matches)) {
                const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: candidate.number });
                if (matches(pr)) { core.info(`Exact main SHA belongs to merged PR #${pr.number}`); return; }
              }
              if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error('No exact merged PR into this repository/main; direct pushes do not publish');
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-build-${{ github.sha }}-${{ github.run_id }}-*
          path: pages-evidence
      - name: Require accepted release and package exact verified build bytes
        id: package
        env:
          PAGES_DEPLOY_ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
        run: node deployment/validate-pages-artifact.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-site
          retention-days: 14
  pages-deploy:
    name: pages-deploy
    needs: [pages-package]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'chameleonjp-lab/ningentomodachi' &&
          needs.pages-package.result == 'success' && vars.PAGES_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ningentomodachi-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify approved Pages configuration before deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
            if (data.html_url !== 'https://chameleonjp-lab.github.io/ningentomodachi/' ||
                data.cname !== null || data.build_type !== 'workflow') {
              throw new Error('Pages configuration is not the approved default public URL and workflow source');
            }
      - name: Reject stale main immediately before deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (data.commit.sha !== context.sha) throw new Error('Stale main build; wait for current main CI');
      - name: Deploy already verified artifact without executing repository code
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.pages-package.outputs.artifact-name }}
  pages-verify:
    name: pages-verify
    needs: [pages-package, pages-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify public commit identity and every deployed static file
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGE_URL: ${{ needs.pages-deploy.outputs.page-url }}
          BUILD_MANIFEST_SHA256: ${{ needs.pages-package.outputs.manifest-sha256 }}
          SITE_MANIFEST_SHA256: ${{ needs.pages-package.outputs.site-manifest-sha256 }}
          PACKAGE_ATTEMPT: ${{ needs.pages-package.outputs.package-attempt }}
          BUILD_ATTEMPT: ${{ needs.pages-package.outputs.build-attempt }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
            const base = new URL(process.env.PAGE_URL);
            if (base.href !== 'https://chameleonjp-lab.github.io/ningentomodachi/') {
              throw new Error('Unexpected public destination; custom domains are not approved');
            }
            const read = async (path) => {
              const url = new URL(path, base);
              if (url.origin !== base.origin || !url.pathname.startsWith(base.pathname)) throw new Error('Unsafe public path');
              url.searchParams.set('verification', `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`);
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000), headers: { 'Cache-Control': 'no-cache' } });
              if (!response.ok) throw new Error(`Public HTTP ${response.status}: ${path}`);
              return Buffer.from(await response.arrayBuffer());
            };
            let manifestBytes;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const bytes = await read('deployment-manifest.json');
                if (digest(bytes) === process.env.SITE_MANIFEST_SHA256) { manifestBytes = bytes; break; }
              } catch (error) { core.info(`Waiting for public deployment: ${error.message}`); }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (!manifestBytes) throw new Error('Public manifest mismatch: inspect live version; last-good preservation is not guaranteed after deploy');
            const manifest = JSON.parse(manifestBytes);
            const version = JSON.parse(await read('version.json'));
            if (version.commit !== context.sha || version.ciRun !== String(context.runId) ||
                version.ciAttempt !== process.env.PACKAGE_ATTEMPT || version.buildAttempt !== process.env.BUILD_ATTEMPT ||
                version.buildManifestSha256 !== process.env.BUILD_MANIFEST_SHA256) throw new Error('Public version mismatch');
            for (const file of manifest.files) {
              if (digest(await read(file.path)) !== file.sha256) throw new Error(`Public file mismatch: ${file.path}`);
            }
            await core.summary.addHeading('Verified Pages deployment').addRaw(`Commit: ${context.sha}\nBuild attempt: ${version.buildAttempt}\nURL: ${base.href}\n`).write();
