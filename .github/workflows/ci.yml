name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  CI_RUN_ID: ${{ github.run_id }}
  CI_RUN_ATTEMPT: ${{ github.run_attempt }}
jobs:
  ci-typecheck:
    name: ci-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          { npm run format && npm run lint && npm run typecheck; } 2>&1 | tee reports/typecheck.log
      - name: Record exact-SHA evidence
        if: ${{ always() }}
        env:
          CHECK_NAME: ci-typecheck
          CHECK_RESULT: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { cpSync, existsSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const hash = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const files = [];
          function collect(directory) {
            if (!existsSync(directory)) return;
            for (const item of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, item.name);
              if (item.isDirectory()) collect(path);
              else if (item.isFile() && path !== 'reports/manifest.json') files.push({ path, sha256: hash(path) });
            }
          }
          collect('reports'); collect('dist');
          const checkedSha = execFileSync('git', ['-C', process.env.GITHUB_WORKSPACE || '.', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const manifest = {
            schemaVersion: 1, contractVersion: 1, checkName: process.env.CHECK_NAME,
            prNumber: process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null,
            prHeadSha: process.env.PR_HEAD_SHA || null, checkedSha,
            baseSha: process.env.BASE_SHA || null,
            p1BaseMainSha: 'a586b99bd9ccca09d48088e323f97f12039e0ced', p1Gate: 'owner-merged-common-base-verified',
            runId: process.env.CI_RUN_ID, runAttempt: process.env.CI_RUN_ATTEMPT,
            result: process.env.CHECK_RESULT, lockfileSha256: hash('package-lock.json'),
            files: files.sort((a, b) => a.path.localeCompare(b.path)),
          };
          mkdirSync('reports', { recursive: true });
          writeFileSync('reports/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          mkdirSync('ci-evidence', { recursive: true });
          cpSync('reports', 'ci-evidence/reports', { recursive: true });
          if (existsSync('dist')) cpSync('dist', 'ci-evidence/dist', { recursive: true });
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-typecheck-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
