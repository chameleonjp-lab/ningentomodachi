      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: ci-unit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  ci-integration:
    name: ci-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:integration -- --reporter=default --reporter=junit --reporter=json --outputFile.junit=reports/integration.xml --outputFile.json=reports/integration.json 2>&1 | tee reports/integration.log
      - name: Record exact-SHA evidence
        if: ${{ always() }}
